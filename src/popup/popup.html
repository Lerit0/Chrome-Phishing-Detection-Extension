<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Dashboard</title>
    <link rel="stylesheet" href="styles/normalize.css"/>
    <link rel="stylesheet" href="styles/base.css"/>
    <link rel="stylesheet" href="styles/style.css"/>
    <script type="module" src="popup.js"></script>
</head>
<body data-state="idle">
    <header class="bar">
        <!-- Circle next to the tittle -->
        <span class="mark" aria-hidden="true"></span>
        <h1>Phishing dashboard</h1>
    </header>

    <main class="status">
        <div class="status__ring" aria-hidden="true"></div>
        <p class="status__text">Ready to check</p>
        <section class="results" aria-live="polite" hidden>
            <div class="score">
                <div class="score__header">
                    <span>Risk score</span>
                    <strong class="score__value">0/100</strong>
                </div>
                <div class="score__track" aria-hidden="true">
                    <span class="score__fill"></span>
                </div>
            </div>
            <div class="checks">
                <p class="checks__title">Checks performed</p>
                <ul class="checks__list"></ul>
            </div>
        </section>
    </main>
 
    <button class="scan-btn">Scan current email</button>
</body>
</html>
