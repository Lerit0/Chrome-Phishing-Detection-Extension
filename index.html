<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Dashboard</title>
    <!-- Change the style names -->
    <link rel="stylesheet" href="style/normalize.css"/>
    <link rel="stylesheet" href="style/base.css"/>
    <link rel="stylesheet" href="style/style.css"/>
</head>
<body>
    <header class="bar">
        <!-- Circle next to the tittle -->
        <span class="mark" aria-hidden="true"></span>
        <h1>Phishing dashboard</h1>
    </header>

    <main class="status" data-state="idle">
        <div class="status__ring" aria-hidden="true"></div>
        <p class="status__text">Ready to check</p>
        <p class="status__detail">No scan run yet in this tab.</p>
    </main>
 
    <button class="scan-btn">Scan current email</button>
</body>
</html>
